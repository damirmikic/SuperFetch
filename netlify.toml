[build]
  publish = "."

[build.environment]
  # netlify/functions/supersport-handball.mjs needs a global WebSocket (Node 22+).
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/sb-api/*"
  to = "https://production-superbet-offer-rs.freetls.fastly.net/sb-rs/api/v2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/fpl-api/*"
  to = "https://fantasy.premierleague.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mx-api/*"
  to = "https://www.merkurxtip.rs/restapi/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/bb-api/*"
  to = "https://sports-sm-distribution-api.de-2.nsoftcdn.com/api/v1/:splat"
  status = 200
  force = true
